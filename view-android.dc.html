<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;background:transparent!important;overflow:hidden}</style></helmet>
<dc-import name="NaldaAndroid" screen="{{ screen }}" theme="{{ theme }}" textSize="{{ textSize }}"
  hint-size="412px,922px" style="width:412px;height:922px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals(){
    const q=new URLSearchParams(location.search);
    return {screen:q.get('screen')||'home',theme:q.get('theme')||'White',textSize:q.get('textSize')||'기본'};
  }
}
</script>
</body>
</html>
