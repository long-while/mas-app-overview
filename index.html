<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nalda 화면 미리보기</title>
<meta name="description" content="Nalda(마스토돈 앱) iOS · Android 프로토타입 — 화면, 아이콘, 색상 토큰을 플랫폼·테마별로 보기">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="bar">
  <div class="bar__brand"><span class="bar__logo">Nalda</span><span class="bar__sub">디자인 미리보기 v0.7</span></div>
  <div class="bar__controls">
    <div class="field field--primary"><span class="field__label">보기</span><div class="seg" data-key="view">
      <button data-v="all">전체 화면</button><button data-v="screen">한 화면</button><button data-v="icons">아이콘</button><button data-v="colors">색상</button></div></div>
    <div class="field" id="platformField"><span class="field__label">플랫폼</span><div class="seg" data-key="p">
      <button data-v="ios">iOS</button><button data-v="android">Android</button><button data-v="both">나란히</button></div></div>
    <div class="field"><span class="field__label">테마</span><div class="seg" data-key="theme">
      <button data-v="White">White</button><button data-v="Dim">Dim</button><button data-v="Black">Black</button></div></div>
    <div class="field" id="sizeField"><span class="field__label">글자</span><div class="seg" data-key="size">
      <button data-v="auto">플랫폼 기본</button><button data-v="작게 보기">작게</button><button data-v="기본">기본</button></div></div>
    <div class="picker" id="picker">
      <button class="icon-btn" id="prev" aria-label="이전 화면 (←)" title="이전 화면 (←)">‹</button>
      <select id="screen" aria-label="화면"></select>
      <button class="icon-btn" id="next" aria-label="다음 화면 (→)" title="다음 화면 (→)">›</button>
    </div>
  </div>
</header>
<main class="stage" id="stage"><div class="loading" id="loading" role="status">불러오는 중…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="catalog.js"></script>
<script src="site.js"></script>
</body>
</html>
