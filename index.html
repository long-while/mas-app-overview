<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nalda 디자인 명세</title>
<meta name="description" content="Nalda(마스토돈 앱) iOS · Android 디자인 명세 — 화면, 핵심 흐름, 아이콘, 색상 토큰을 플랫폼·테마별로 보기">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181B%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#stage">본문으로 건너뛰기</a>
<header class="bar" id="bar">
  <a class="bar__brand" href="?" aria-label="Nalda 디자인 명세 — 소개로">
    <span class="bar__logo">Nalda</span><span class="bar__sub">디자인 명세</span>
  </a>
  <button class="bar__more" id="more" aria-expanded="false" aria-controls="settings">플랫폼 · 테마 · 글자</button>
  <div class="bar__controls">
    <div class="field field--view"><span class="field__label" id="lbl-view">보기</span>
      <div class="seg" data-key="view" role="group" aria-labelledby="lbl-view">
        <button data-v="cover">소개</button><button data-v="flows">핵심 흐름</button><button data-v="all">전체 화면</button><button data-v="screen">한 화면</button><button data-v="icons">아이콘</button><button data-v="colors">색상</button><button data-v="appendix">부록</button>
      </div>
    </div>
    <div class="bar__settings" id="settings">
    <div class="field"><span class="field__label" id="lbl-p">플랫폼</span>
      <div class="seg" data-key="p" role="group" aria-labelledby="lbl-p">
        <button data-v="ios">iOS</button><button data-v="android">Android</button><button data-v="both">나란히</button>
      </div>
      <span class="field__why" id="why-p" role="tooltip"></span>
    </div>
    <div class="field"><span class="field__label" id="lbl-theme">테마</span>
      <div class="seg" data-key="theme" role="group" aria-labelledby="lbl-theme">
        <button data-v="White">White</button><button data-v="Dim">Dim</button><button data-v="Black">Black</button>
      </div>
      <span class="field__why" id="why-theme" role="tooltip"></span>
    </div>
    <div class="field"><span class="field__label" id="lbl-size">글자</span>
      <div class="seg" data-key="size" role="group" aria-labelledby="lbl-size">
        <button data-v="auto">플랫폼 기본</button><button data-v="작게 보기">작게</button><button data-v="기본">기본</button>
      </div>
      <span class="field__why" id="why-size" role="tooltip"></span>
    </div>
    </div>
  </div>
</header>
<main class="stage" id="stage" tabindex="-1"><div class="loading" id="loading" role="status">불러오는 중…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="frames.js"></script>
<script src="catalog.js"></script>
<script src="docs.js"></script>
<script src="grid.js"></script>
<script src="site.js"></script>
</body>
</html>
