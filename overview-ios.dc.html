<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;background:transparent}</style></helmet>
<dc-import name="Nalda Overview" theme="{{ theme }}" style="display:block;width:100%"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals(){
    const q=new URLSearchParams(location.search);
    return {screen:q.get('screen')||'home',theme:q.get('theme')||'White',textSize:q.get('textSize')||'작게 보기'};
  }
}
</script>
</body>
</html>
