<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;background:transparent}html{overflow-x:hidden;overflow-y:scroll;scrollbar-width:auto;scrollbar-color:rgba(83,100,113,.6) rgba(15,20,25,.06)}html::-webkit-scrollbar{display:block;width:16px;height:16px}html::-webkit-scrollbar-track{background:rgba(15,20,25,.06)}html::-webkit-scrollbar-thumb{background:rgba(83,100,113,.55);border-radius:8px;border:4px solid transparent;background-clip:padding-box;min-height:48px}</style></helmet>
<dc-import name="Nalda Android Overview" theme="{{ theme }}" style="display:block;width:100%"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals(){
    const q=new URLSearchParams(location.search);
    return {screen:q.get('screen')||'home',theme:q.get('theme')||'White',textSize:q.get('textSize')||'기본'};
  }
}
</script>
</body>
</html>
